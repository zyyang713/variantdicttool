<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>異體字字典：字圖查詢小工具</title>
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    .container {
      max-width: 500px;
      margin: 50px auto;
    }
    label, input, button, select {
      display: block;
      margin: 10px 0;
    }
    iframe {
      margin-top: 20px;
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body background="banner.png">
  <div class="container">
    <center>
    <h1>異體字字典：字圖查詢小工具</h1>
    <h2>輸入查詢資訊</h2>

    <label for="bookCode">書籍代號（三位數）：</label>
    <input type="text" id="bookCode" maxlength="3" placeholder="例如：001" />

    <label for="glyphId">字圖ID（七位數）：</label>
    <input type="text" id="glyphId" maxlength="7" placeholder="例如：0001234" />

    <label for="displayMode">顯示方式：</label>
    <select id="displayMode">
      <option value="newTab">在新分頁開啟</option>
      <option value="sameTab">在本頁跳轉</option>
    </select>

    <button onclick="goToImage()">確認</button>
	</center>
    <div id="iframeContainer" style="display:none;">
      <h3>查詢結果：</h3>
	  <center>
      <iframe id="imageFrame" src=""></iframe>
	  </center>
    </div>
  </div>

  <script>
    // 按下 Enter 鍵即查詢
    document.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        goToImage();
      }
    });

    function goToImage() {
      const bookCode = document.getElementById("bookCode").value.trim();
      const glyphId = document.getElementById("glyphId").value.trim();
      const displayMode = document.getElementById("displayMode").value;

      const bookCodeValid = /^\d{3}$/.test(bookCode);
      const glyphIdValid = /^\d{7}$/.test(glyphId);

      if (!bookCodeValid || !glyphIdValid) {
        alert("請輸入正確格式的書籍代號（三位數）與字圖ID（七位數）");
        return;
      }

      const url = `https://dict.variants.moe.edu.tw/book_piece/${bookCode}/${glyphId}.png`;

      if (displayMode === "newTab") {
        window.open(url, "_blank");
      } else if (displayMode === "sameTab") {
        window.location.href = url;
      }
    }
  </script>
</body>
</html>
